name: Check workshop app
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: demo-key
          VITE_FIREBASE_AUTH_DOMAIN: demo-chaicart.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: demo-chaicart
          VITE_FIREBASE_APP_ID: demo-app
      - run: npm run lint
      - run: node --test test/rum.test.mjs test/rum-business.test.mjs test/activity-scoring.test.mjs
      # Match the Firebase Node.js 22 cloud builder lockfile validation.
      - run: npx --yes npm@10 ci --prefix functions
      - run: npm test --prefix functions
      - run: npx firebase-tools emulators:exec --project demo-chaicart --only firestore "node --test --test-concurrency=1 test/rules.test.mjs test/workshop-actions.test.mjs test/business-audit.test.mjs"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:rehearsal
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: workshop-rehearsal-failure
          path: |
            test-results/
            playwright-report/
          retention-days: 7
